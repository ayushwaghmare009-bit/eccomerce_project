<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - MyMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card border-0 shadow-sm p-4">
            <h2 class="fw-bold mb-4 text-center">Create Account</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 btn-lg mt-3">Register</button>
            </form>
            <p class="text-center mt-3 text-muted">Already have an account? <a href="{% url 'login' %}" class="text-dark fw-bold">Login here</a></p>
        </div>
    </div>
</body>
</html>
