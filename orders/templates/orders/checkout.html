<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - MyMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container"><a class="navbar-brand fw-bold" href="{% url 'store_home' %}">🛒 MyMarketplace</a></div>
    </nav>
    <div class="container my-5">
        <h2 class="fw-bold mb-4">Billing & Shipping Details</h2>
        <form method="POST" class="row g-3 bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="col-md-6"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" required></div>
            <div class="col-12"><label class="form-label">Address</label><input type="text" name="address" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">City</label><input type="text" name="city" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Postal Code</label><input type="text" name="postal_code" class="form-control" required></div>
            <div class="col-12 mt-4"><button type="submit" class="btn btn-success btn-lg w-100">Place Order</button></div>
        </form>
    </div>
</body>
</html>
