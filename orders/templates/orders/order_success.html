<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success - MyMarketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">
    <div class="container bg-white p-5 rounded shadow-sm mt-5" style="max-width: 600px;">
        <h1 class="text-success fw-bold mb-3">🎉 Order Placed Successfully!</h1>
        <p class="text-muted">Thank you for your purchase. Your order ID is <strong>#{{ order.id }}</strong>.</p>
        <a href="{% url 'store_home' %}" class="btn btn-dark mt-3">Continue Shopping</a>
    </div>
</body>
</html>
